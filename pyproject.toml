[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fare-hunter"
version = "0.1.0"
description = "Flight price tracker with real-time alerts and email notifications"

readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.12"

dependencies = [
    "fastapi>=0.109.1",
    "uvicorn[standard]>=0.27.0",
    "sqlalchemy>=2.0.25",
    "psycopg2-binary==2.9.9",
    "pydantic>=2.6.0",
    "email-validator>=2.1.0",
    "pydantic-settings>=2.1.0",
    "celery>=5.3.6",
    "redis>=5.0.1",
    "pyjwt>=2.8.0",
    "passlib[bcrypt]==1.7.4",
    "bcrypt>=4.1.0,<5.0.0",
    "sendgrid==6.10.0",
    "python-multipart>=0.0.7",
    "requests>=2.32.4",
    "alembic>=1.13.1",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.1.8",
    "black>=24.3.0",
    "httpx>=0.26.0",
    "mypy>=1.8.0",
    "types-passlib",
    "pip-audit>=2.10.1",
    "types-requests>=2.33.0.20261006",
    "types-python-jose>=3.5.0.20260408",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "--strict-markers"

[tool.black]
line-length = 120
target-version = ["py312"]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
ignore_missing_imports = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
strict_equality = true
plugins = ["pydantic.mypy"]
 
[[tool.mypy.overrides]]
module = "tests.*"
ignore_errors = true
