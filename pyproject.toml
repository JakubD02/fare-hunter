[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fare-hunter"
version = "0.1.0"
description = "Flight price tracker with real-time alerts and email notifications"

readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.12"

dependencies = [
    "fastapi==0.104.1",
    "uvicorn[standard]==0.24.0",
    "sqlalchemy==2.0.23",
    "psycopg2-binary==2.9.9",
    "pydantic==2.8.0",
    "email-validator>=2.0.0",
    "pydantic-settings==2.1.0",
    "celery==5.3.4",
    "redis==5.0.1",
    "pyjwt>=2.8.0",
    "python-jose==3.3.0",
    "passlib[bcrypt]==1.7.4",
    "bcrypt>=4.1.0,<5.0.0",
    "sendgrid==6.10.0",
    "python-multipart==0.0.6",
    "requests==2.31.0",
]

[dependency-groups]
dev = [
    "pytest==7.4.3",
    "pytest-asyncio==0.21.1",
    "pytest-cov==4.1.0",
    "ruff==0.1.8",
    "black==23.12.0",
    "httpx==0.25.2",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "--strict-markers"

[tool.black]
line-length = 120
target-version = ["py312"]