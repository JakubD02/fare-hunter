name: Tests

on:
  push:
    branches: ["main", "master"]

jobs:
  test:
    name: Run tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: fare_hunter
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        run: pip install uv

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run Ruff format check
        run: uv run ruff check .

      - name: Run Ruff formatter
        run: uv run ruff format .

      - name: Run mypy type check
        run: uv run mypy app

      - name: Run Bandit security analysis
        run: uv run bandit -r app -f json -o bandit-report.json || true

      - name: Run pytest
        env:
          DATABASE_URL: postgresql+psycopg2://postgres:postgres@localhost:5432/fare_hunter
          REDIS_URL: redis://localhost:6379/0
          JWT_SECRET_KEY: test-secret-key
          SENDGRID_API_KEY: test-key
          SERPAPI_KEY: test-key
          APP_URL: http://localhost:8000
        run: uv run pytest

  audit-dependencies:
    name: Audit dependencies for vulnerabilities
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        run: pip install uv

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run pip-audit
        run: uv run pip-audit --skip-editable

  detect-secrets:
      name: Detect hardcoded secrets
      runs-on: ubuntu-latest
      steps:
        - name: Checkout code
          uses: actions/checkout@v4
          with:
            fetch-depth: 0

        - name: Run Gitleaks
          uses: gitleaks/gitleaks-action@v2
          env:
            GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}